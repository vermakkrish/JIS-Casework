<tspan x="710" dy="28.75">appropriate error response</tspan>
</text>
<rect class="node" x="85.0" y="1512.0" width="330" height="76" rx="12"/>
<text x="250" y="1544" font-size="23" text-anchor="middle" font-weight="normal">
<tspan x="250" dy="0">View failure feedback</tspan>
<tspan x="250" dy="28.75">(no success confirmation)</tspan>
</text>
<circle cx="250" cy="1660" r="18" fill="white" stroke="#222" stroke-width="1.7"/><circle cx="250" cy="1660" r="12" fill="#111"/>
<path d="M55 1740 H1835 L1850 1755 V1835 H55 Z M1835 1740 V1755 H1850" fill="#fffef1" stroke="#555" stroke-width="1.2"/>
<text x="75" y="1767" font-size="21" text-anchor="start" font-weight="normal">
<tspan x="75" dy="0">Transaction rules: Case, Lawyer links and audit commit together; database-enforced CIN uniqueness. Any attempt exception rolls back.</tspan>
</text>
<text x="75" y="1795" font-size="21" text-anchor="start" font-weight="normal">
<tspan x="75" dy="0">Retry guard: the current code retries IntegrityError (including CIN conflicts), with a fresh CIN and transaction; maximum 5 attempts.</tspan>
</text>
<text x="75" y="1823" font-size="21" text-anchor="start" font-weight="normal">
<tspan x="75" dy="0">Failure feedback: validation / exhausted retries → bound form errors; revoked access → denial; unexpected database failure → error response.</tspan>
</text>
