# Persistent paid resources are intentional. Review current prices before applying.
databases:
  - name: jis-db
    databaseName: jis
    user: jis
    plan: 0.1c-256mb
    postgresMajorVersion: '18'
    ipAllowList: []
services:
  - type: web
    name: jis-casework
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: JIS_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jis-db
          property: connectionString
