services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: jis
      POSTGRES_USER: jis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - jis_postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jis -d jis]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      JIS_ENV: ${JIS_ENV:-development}
      DATABASE_URL: postgresql://jis:${POSTGRES_PASSWORD}@db:5432/jis
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  jis_postgres:
